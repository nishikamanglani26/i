<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .con{
            height: 99vh;
            width: 207vh;
            background: linear-gradient(90deg, skyblue,purple 80%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        form{
            height: 75vh;
            width: 60vh;
            background-color: white;
            border-radius: 30px;
        }
        h1{
            height: 10%;
            text-align: center;
            margin-top: 5%;
        }
        .email, .password, .login{
            /* border: 1px solid black; */
            width: 80%;
            margin: auto;
            margin-top: 5%;
            height: 20%;
        }
        input{
            height: 50%;
            width: 100%;
            margin-top: 5%;
        }
        p{
            margin-top: 5%;
        }
        #login{
            background: linear-gradient(90deg, skyblue,purple 80%);
            border-radius: 20px;
            border: none;
            color: white;
        }
        .password>p{
            color: grey;
            font-style: italic;
        }
        .login>p{
            text-align: center;
        }
        a{
            text-decoration: none;
            font-style: italic;
        }
        #login:hover{
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="con">
        <form action="">
            <h1>Log In Form</h1>
            <div class="email">
                <label for="">Email</label>
                <br>
                <input type="email" placeholder="xyz@gmail.com">
            </div>
            <br>
            <div class="password">
                <label for="">Password</label>
                <br>
                <input type="password" placeholder="abcd@1234">
                <p>Forget Password?</p>
            </div>
            <br>
            <div class="login">
                <input type="button" value="Login" id="login">
                <p>Not a Member? <a href="signup.html">Sign Up</a></p>
            </div>
        </form>
    </div>
</body>
</html>
