<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            
            border: 1px solid black ;
            display: flex;
        }
        .box{
            height: 100%;
            width: 25%;
            border: 1px solid black;
        }
        img{
            width: 100%;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1 align = "center">Dynamic Gallery</h1>
    <div class="con">
        <div class="box">
            <img src="Capture.PNG" alt="">
            <img src="cloud.PNG" alt="">
            <img src="img.PNG" alt="">
            <img src="mountain.png" alt="">
        </div>
        <div class="box">
            <img src="cloud.PNG" alt="">
            <img src="Capture.PNG" alt="">
            <img src="mountain.png" alt="">
            <img src="img.PNG" alt="">
        </div>
        <div class="box">
            <img src="mountain.png" alt="">
            <img src="img.PNG" alt="">
            <img src="cloud.PNG" alt="">
            <img src="Capture.PNG" alt=""></div>
        <div class="box">
            <img src="img.PNG" alt="">
            <img src="mountain.png" alt="">
            <img src="Capture.PNG" alt="">
            <img src="cloud.PNG" alt=""></div>
    </div>
</body>
</html>
