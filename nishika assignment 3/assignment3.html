<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
            text-align: center;
            color: beige;
        }
.con{
    height: 600px;
    border: 1px solid black ;
    

}
.header{
    height: 20%;
    background-color: rgb(231, 100, 144);
     border: 1px solid black ;
}
.center{
    height: 60%;
    background-color: rgb(95, 103, 216);
    display:flex;
     border: 1px solid black ;

}
.left{
    height: 100%;
    width: 30%;
    background-color: rgb(36, 151, 132);
     border: 1px solid black ;
}
.right{
    height: 100%;
    width: 70%;
    background-color: rgb(14, 54, 92);
     border: 1px solid black ;
}
.top{
    height: 50%;
    background-color: rgb(54, 23, 104);
     border: 1px solid black ;
}
.bottom{
    height: 50%;
    background-color: rgb(16, 88, 88);
    display:flex;
     border: 1px solid black ;
}
.r1{
    height: 100%;
    width: 50%;
    background-color: rgb(81, 95, 16);
     border: 1px solid black ;

}
.r2{
    height: 100%;
    width: 50%;
    background-color: rgb(28, 117, 73);
     border: 1px solid black ;
}
.footer{
    height: 20%;
    background-color: rgb(163, 14, 44);
     border: 1px solid black ;      
}
    </style>
</head>
<body>
    <div class="con">
         <div class="header">
            <h1>header</h1>
         </div>
         <div class="center">
            <div class="left"><h1>left</h1></div>
            <div class="right">
                <div class="top"><h1>top</h1></div>
                <div class="bottom">
                    <div class="r1"><h1>r1</h1></div>
                    <div class="r2"><h1>r2</h1></div>
                </div>
            </div>
         </div>
         <div class="footer"><h1>footer</h1></div>
    </div>
</body>
</html>
